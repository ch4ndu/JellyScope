android.useAndroidX=true
kotlin.code.style=official
# The MobileVLCKit cinterop is declared per iOS target but consumed from the
# shared `iosMain` source set. Without commonization those declarations resolve
# only inside each leaf target, so `compileIosMainKotlinMetadata` and IDE code
# insight report every VLCKit reference as unresolved.
kotlin.mpp.enableCInteropCommonization=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
jellyscope.versionCode=88
jellyscope.versionName=0.1.0-alpha92
# Desktop's displayed version stays independent from the native package version.
jellyscope.desktop.version=0.1.0-alpha89
# macOS jpackage requires one to three integers with a positive first component.
jellyscope.desktop.packageVersion=1.0.0
