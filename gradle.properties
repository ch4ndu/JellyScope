android.useAndroidX=true
kotlin.code.style=official
# VLCKit cinterop is declared on each iOS/tvOS target and consumed from appleMain.
kotlin.mpp.enableCInteropCommonization=true
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
jellyscope.versionCode=91
jellyscope.versionName=0.1.0-alpha94
# Desktop's displayed version stays independent from the native package version.
jellyscope.desktop.version=0.1.0-alpha94
# macOS jpackage requires one to three integers with a positive first component.
jellyscope.desktop.packageVersion=1.0.0
