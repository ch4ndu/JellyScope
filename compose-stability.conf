// Compose compiler stability configuration for immutable domain values.
//
// Domain models are immutable value types (data classes / value objects), but the
// Compose compiler cannot always prove it — they carry List/Map fields and
// reference types from modules the compiler treats as unstable, so composables
// receiving them can be recomposed unnecessarily. Declaring the package stable
// lets unchanged domain values participate in normal skip decisions.
//
// Only add packages whose types are genuinely immutable — marking a mutable type
// stable makes Compose skip real updates and show stale UI.
com.jellyscope.core.domain.model.*
